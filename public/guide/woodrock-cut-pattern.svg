<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <g transform="translate(70,20)">
    <rect x="0" y="0" width="910" height="610" fill="none" stroke="#1f2937" stroke-width="2"/>

    <!-- waste margins (left/right, 5mm each) - not part of the 17-triangle pattern -->
    <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3">
      <polygon points="0,0 55,0 5,610 0,610"/>
      <polygon points="855,0 910,0 910,610 905,610"/>
    </g>

    <!-- yellow (base-at-bottom, base = 100mm) triangles: 1,3,5,7,9,11,13,15,17 -->
    <g fill="#fbd97e" stroke="#c2660c" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="55,0 5,610 105,610"/>
      <polygon points="155,0 105,610 205,610"/>
      <polygon points="255,0 205,610 305,610"/>
      <polygon points="355,0 305,610 405,610"/>
      <polygon points="455,0 405,610 505,610"/>
      <polygon points="555,0 505,610 605,610"/>
      <polygon points="655,0 605,610 705,610"/>
      <polygon points="755,0 705,610 805,610"/>
      <polygon points="855,0 805,610 905,610"/>
    </g>

    <!-- green (base-at-top, base = 100mm) triangles: 2,4,6,8,10,12,14,16 -->
    <g fill="#a8e6cf" stroke="#0d9488" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="55,0 155,0 105,610"/>
      <polygon points="155,0 255,0 205,610"/>
      <polygon points="255,0 355,0 305,610"/>
      <polygon points="355,0 455,0 405,610"/>
      <polygon points="455,0 555,0 505,610"/>
      <polygon points="555,0 655,0 605,610"/>
      <polygon points="655,0 755,0 705,610"/>
      <polygon points="755,0 855,0 805,610"/>
    </g>

    <g font-size="17" fill="#9a4b0f" text-anchor="middle">
      <text x="55" y="406.67">1</text>
      <text x="155" y="406.67">3</text>
      <text x="255" y="406.67">5</text>
      <text x="355" y="406.67">7</text>
      <text x="455" y="406.67">9</text>
      <text x="555" y="406.67">11</text>
      <text x="655" y="406.67">13</text>
      <text x="755" y="406.67">15</text>
      <text x="855" y="406.67">17</text>
    </g>
    <g font-size="17" fill="#0f766e" text-anchor="middle">
      <text x="105" y="203.33">2</text>
      <text x="205" y="203.33">4</text>
      <text x="305" y="203.33">6</text>
      <text x="405" y="203.33">8</text>
      <text x="505" y="203.33">10</text>
      <text x="605" y="203.33">12</text>
      <text x="705" y="203.33">14</text>
      <text x="805" y="203.33">16</text>
    </g>
  </g>

  <!-- bottom dimension: 910mm (91cm) -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="70" y1="655" x2="980" y2="655"/>
    <line x1="70" y1="647" x2="70" y2="663"/>
    <line x1="980" y1="647" x2="980" y2="663"/>
  </g>
  <text x="525" y="685" font-size="16" fill="#334155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    910mm (91cm)
  </text>

  <!-- left dimension: 610mm (61cm) -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="35" y1="20" x2="35" y2="630"/>
    <line x1="27" y1="20" x2="43" y2="20"/>
    <line x1="27" y1="630" x2="43" y2="630"/>
  </g>
  <text x="0" y="0" font-size="16" fill="#334155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" transform="translate(18,325) rotate(-90)">
    610mm (61cm)
  </text>
</svg>
